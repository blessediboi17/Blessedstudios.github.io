<!DOCTYPE html>
<html>
<head>
    <title>CEO Dashboard | Blessed Studios</title>
    <style>
        body { background: #050a14; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #112240; padding: 20px; border-radius: 10px; border-left: 5px solid #64ffda; margin-bottom: 20px; }
        textarea { width: 100%; background: #0a192f; color: white; border: 1px solid #64ffda; padding: 10px; margin: 10px 0; }
        .btn { background: #64ffda; color: #0a192f; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .logout { background: #ff4d4d; color: white; margin-left: 10px; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('isBlessedAdmin') !== 'true') { window.location.href = "index.html"; }
    </script>

    <h1>🎬 CEO COMMAND CENTER</h1>
    
    <div class="card">
        <h3>Update Website Content (Live)</h3>
        <label>Vision Statement:</label>
        <textarea id="visionInput" rows="2"></textarea>
        
        <label>Mission Statement:</label>
        <textarea id="missionInput" rows="2"></textarea>
        
        <button class="btn" onclick="updateSite()">PUBLISH CHANGES</button>
        <button class="btn logout" onclick="localStorage.removeItem('isBlessedAdmin'); location.href='index.html'">LOGOUT</button>
    </div>

    <div class="card">
        <h3>View Recruitment</h3>
        <p>Applications are sent to: <strong>iboiblessed1@gmail.com</strong></p>
        <a href="https://formspree.io/forms/mqaejprz/submissions" target="_blank" style="color: #64ffda;">Click here to view all actor lists</a>
    </div>

    <script>
        // Pre-fill with current text
        document.getElementById('visionInput').value = localStorage.getItem('vision') || "";
        document.getElementById('missionInput').value = localStorage.getItem('mission') || "";

        function updateSite() {
            localStorage.setItem('vision', document.getElementById('visionInput').value);
            localStorage.setItem('mission', document.getElementById('missionInput').value);
            alert("✅ Site updated! Refresh the home page to see changes.");
        }
    </script>
</body>
            </html>

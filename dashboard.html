<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Blessed Studios</title>
    <style>
        body { background: #050a14; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #112240; padding: 20px; border-radius: 10px; border-left: 5px solid #64ffda; margin-bottom: 20px; }
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    </style>
</head>
<body>

    <script>
        // Security Check
        if (localStorage.getItem('isBlessedAdmin') !== 'true') {
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.removeItem('isBlessedAdmin');
            window.location.href = "index.html";
        }
    </script>

    <div class="container">
        <nav>
            <h1 style="color: #64ffda;">CEO DASHBOARD</h1>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </nav>

        <div class="card">
            <h3>🎬 Production Status</h3>
            <p>Current Projects: <strong>3 Active</strong></p>
            <p>Storage Capacity: 85% Full</p>
        </div>

        <div class="card">
            <h3>👥 Team Announcements</h3>
            <p>New film equipment arriving next week. All directors please attend the Monday briefing.</p>
        </div>
    </div>

</body>
                </html>

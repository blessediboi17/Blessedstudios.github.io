<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="google-site-verification" content="google3e79578c45ccecb5" />
    
    <title>Blessed Studios | Impactful content</title>
    <meta name="description" content="Official platform of Blessed Studios. Impactful content, worship, and media excellence.">
    
    <link rel="icon" href="https://i.ibb.co/XfHqN4m/Blessed-Studios-Card.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #030712; --text: #ffffff; --primary: #00d2ff;
            --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
            --card: #0a1120;
        }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        nav { position: fixed; top: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-sizing: border-box; backdrop-filter: blur(10px); background: rgba(3,7,18,0.8); border-bottom: 1px solid var(--border); }
        .logo-text { font-weight: 900; letter-spacing: 1px; font-size: 16px; color: var(--primary); text-transform: uppercase; }
        
        header { padding: 100px 20px 40px; text-align: center; }
        h1 { font-size: 2.2rem; font-weight: 900; margin: 0; text-transform: uppercase; }
        .impact-tag { font-size: 10px; letter-spacing: 5px; color: var(--primary); text-transform: uppercase; margin-top: 10px; display: block; font-weight: 800; }

        .container { width: 92%; margin: 0 auto; }
        .glass-card {
            background: var(--card); border: 1px solid var(--border);
            padding: 20px; border-radius: 20px; margin-bottom: 25px;
            backdrop-filter: blur(20px);
        }

        /* MOBILE ADMIN WINDOW FIX */
        #admin-window { 
            position: fixed; bottom: 90px; right: 5%; left: 5%; 
            width: 90%; max-height: 75vh; display: none; z-index: 9999; 
            overflow-y: auto; box-sizing: border-box;
        }
        .admin-input { 
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border); 
            color: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; 
            box-sizing: border-box; font-size: 14px;
        }
        .action-btn { 
            background: var(--primary); color: white; border: none; 
            padding: 15px; border-radius: 10px; font-weight: 800; 
            width: 100%; cursor: pointer; text-transform: uppercase;
        }

        #ai-action-button { 
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; 
            background: linear-gradient(135deg, var(--primary), #bc13fe); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.4); 
        }

        .video-vault { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; }
        .video-vault iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        footer { padding: 40px 20px; text-align: center; border-top: 1px solid var(--border); opacity: 0.6; font-size: 10px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-text">Blessed Studios</div>
        <div style="font-size: 12px;">CEO PORTAL</div>
    </nav>

    <header>
        <h1>BLESSED STUDIOS</h1>
        <span class="impact-tag">Impactful Content</span>
    </header>

    <div class="container" id="live-feed">
        </div>

    <div id="ai-action-button" onclick="toggleAdmin()">✨</div>

    <div id="admin-window" class="glass-card">
        <div id="admin-auth">
            <input type="password" id="admin-pass" class="admin-input" placeholder="CEO Key">
            <button class="action-btn" onclick="unlockAdmin()">Access Studio</button>
        </div>
        <div id="admin-post" style="display:none;">
            <input type="text" id="p-title" class="admin-input" placeholder="Post Title">
            <input type="text" id="p-label" class="admin-input" placeholder="Label (e.g. WORSHIP)">
            <input type="text" id="p-video" class="admin-input" placeholder="YouTube Link">
            <input type="file" id="p-file" class="admin-input">
            <textarea id="p-content" class="admin-input" style="height:80px;" placeholder="Write your message..."></textarea>
            <button id="pub-btn" class="action-btn" onclick="publishPost()">🚀 GLOBAL RELEASE</button>
        </div>
    </div>

    <footer>
        &copy; 2026 BLESSED STUDIOS | CEO BLESSED FREDRICK IBOI<br>
        Support: blessedstudios50@gmail.com
    </footer>

    <script>
        const SB_URL = "https://ulctlyvistlcjapqbzmp.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY3RseXZpc3RsY2phcHFiem1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjk2OTEsImV4cCI6MjA4NjkwNTY5MX0.tCm1YPUWQ8s2e9mdq-wMhSJql10lrApfRF40wDHC7ls";
        const CEO_KEY = "Blessed2026";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        function toggleAdmin() {
            const win = document.getElementById('admin-window');
            win.style.display = win.style.display === 'block' ? 'none' : 'block';
        }

        function unlockAdmin() {
            if(document.getElementById('admin-pass').value === CEO_KEY) {
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-post').style.display = 'block';
            } else { alert("Incorrect CEO Key"); }
        }

        function getYTID(url) {
            const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(reg);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function publishPost() {
            const btn = document.getElementById('pub-btn');
            btn.innerText = "UPLOADING..."; btn.disabled = true;

            const title = document.getElementById('p-title').value;
            const label = document.getElementById('p-label').value;
            const video_url = document.getElementById('p-video').value;
            const content = document.getElementById('p-content').value;
            const file = document.getElementById('p-file').files[0];

            let image = "";
            if(file) {
                const path = `uploads/${Date.now()}_${file.name}`;
                await _supabase.storage.from('images').upload(path, file);
                image = _supabase.storage.from('images').getPublicUrl(path).data.publicUrl;
            }

            const { error } = await _supabase.from('posts').insert([{ title, label, video_url, content, image }]);
            
            if(error) {
                alert("Error: Make sure RLS is disabled in Supabase SQL Editor!");
                btn.innerText = "RETRY RELEASE"; btn.disabled = false;
            } else { location.reload(); }
        }

        async function loadFeed() {
            const { data } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            if(data) {
                document.getElementById('live-feed').innerHTML = data.map(p => {
                    const yt = getYTID(p.video_url || "");
                    return `
                        <div class="glass-card">
                            ${yt ? `<div class="video-vault"><iframe src="https://www.youtube.com/embed/${yt}" allowfullscreen></iframe></div>` : ''}
                            ${p.image && !yt ? `<img src="${p.image}" style="width:100%; border-radius:12px; margin-bottom:15px;">` : ''}
                            <span class="impact-tag" style="margin-bottom:5px;">${p.label || 'Studio Update'}</span>
                            <h2 style="margin:0 0 10px 0; font-size:20px;">${p.title}</h2>
                            <p style="font-size:14px; opacity:0.8; line-height:1.6;">${p.content}</p>
                        </div>
                    `;
                }).join('');
            }
        }
        loadFeed();
    </script>
</body>
    </html>

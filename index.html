<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessed Studios | Official Site</title>
    <style>
        :root { --accent: #64ffda; --bg: #0a192f; --navy-light: #112240; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; scroll-behavior: smooth; }
        nav { background: var(--bg); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; margin: 0 10px; text-decoration: none; font-size: 14px; font-weight: bold; }
        header { padding: 80px 20px; text-align: center; background: #0a192f; }
        section { padding: 40px 20px; max-width: 800px; margin: auto; }
        .card { background: var(--navy-light); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); margin-bottom: 30px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #233554; background: var(--bg); color: white; box-sizing: border-box; }
        .btn { background: var(--accent); color: var(--bg); border: none; padding: 15px 30px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">🏠 HOME</a>
        <a href="gallery.html">🎬 MOVIES</a>
        <a href="game.html">🎮 GAME</a>
        <a href="shop.html">🛒 SHOP</a>
        <a href="#login-section" style="color: var(--accent);">🔑 TEAM</a>
    </nav>

    <header>
        <h1 style="font-size: 2.5rem; margin: 0;">BLESSED STUDIOS</h1>
        <p style="color: var(--accent); letter-spacing: 2px;">VISION • MISSION • UPDATES</p>
    </header>

    <section id="about">
        <div class="card" style="text-align: center;">
            <h2 style="color: var(--accent);">OUR VISION</h2>
            <p id="vision-text">Loading vision...</p>
            <h2 style="color: var(--accent); margin-top: 30px;">OUR MISSION</h2>
            <p id="mission-text">Loading mission...</p>
        </div>
    </section>

    <section id="recruitment">
        <div class="card">
            <h2 style="text-align: center; color: var(--accent);">🎭 JOIN THE CAST</h2>
            <p style="text-align: center; color: #8892b0; margin-bottom: 20px;">Ages 5-60. Recruiting now for upcoming projects.</p>
            
            <form action="https://formspree.io/f/xeeekqkr" method="POST">
                <input type="text" name="Name" placeholder="Full Name" required>
                <input type="email" name="Email" placeholder="Email Address" required>
                <input type="text" name="WhatsApp" placeholder="WhatsApp Number" required>
                
                <div style="display: flex; gap: 10px;">
                    <input type="number" name="Age" placeholder="Age" min="5" max="60" required style="width: 50%;">
                    <select name="Gender" style="width: 50%;">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <textarea name="Experience" placeholder="Tell us about your acting experience..." rows="3"></textarea>
                
                <input type="hidden" name="_next" value="https://blessedstudios.netlify.app/success.html">
                
                <button type="submit" class="btn">SUBMIT APPLICATION</button>
            </form>
        </div>
    </section>

    <section id="login-section">
        <div class="card" style="max-width: 350px; margin: auto; text-align: center;">
            <h3 style="color: var(--accent);">TEAM PORTAL</h3>
            <input type="password" id="ceoPassword" placeholder="Enter Password">
            <button onclick="checkAccess()" class="btn">LOGIN</button>
        </div>
    </section>

    <script>
        // Automatic display of Vision and Mission from Dashboard
        document.getElementById('vision-text').innerText = localStorage.getItem('vision') || "Leading the cinematic revolution in Liberia.";
        document.getElementById('mission-text').innerText = localStorage.getItem('mission') || "To empower young creators and produce world-class films.";

        function checkAccess() {
            if (document.getElementById('ceoPassword').value === "Blessedstudios") {
                localStorage.setItem('isBlessedAdmin', 'true');
                window.location.href = "dashboard.html";
            } else {
                alert("Incorrect Password.");
            }
        }
    </script>
</body>
            </html>

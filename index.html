<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessed Studios Impactful content</title>
    <style>
        :root { 
            --accent: #64ffda; 
            --bg: #050a14; 
            --glass: rgba(255, 255, 255, 0.05);
            --verified-blue: #1DA1F2;
        }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header / Profile Style */
        header { 
            width: 100%;
            padding: 50px 20px; 
            text-align: center;
            background: linear-gradient(to bottom, #112240, #050a14);
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 { 
            font-size: 2rem; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        /* The Verified Badge */
        .verified-badge {
            color: var(--verified-blue);
            font-size: 20px;
        }

        .follow-btn {
            background: var(--accent);
            color: #050a14;
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.3);
        }

        .follow-btn:active { transform: scale(0.95); }

        /* Modern Glass Card */
        section { 
            width: 90%; 
            max-width: 450px; 
            margin: 20px 0; 
        }

        .card { 
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        h2 { color: var(--accent); font-size: 1.2rem; margin-top: 0; }
        p { color: #a8b2d1; font-size: 15px; line-height: 1.6; }

        /* Form Styling */
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 10px; 
            border: 1px solid #233554; 
            background: rgba(0,0,0,0.3); 
            color: white; 
            box-sizing: border-box; 
        }

        .submit-btn { 
            background: transparent; 
            color: var(--accent); 
            border: 1px solid var(--accent); 
            padding: 15px; 
            border-radius: 10px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer;
            margin-top: 10px;
        }

        footer { padding: 40px; color: #4e5d72; font-size: 12px; text-align: center; }

    </style>
</head>
<body>

    <header>
        <div class="profile-container">
            <div style="font-size: 50px;">🎬</div>
            <h1>BLESSED STUDIOS <span class="verified-badge">✔</span></h1>
            <p style="margin: 0; color: var(--accent); font-size: 13px; letter-spacing: 1px;">INSPIRING CONTENT</p>
            
            <a href="YOUR_SOCIAL_LINK_HERE" class="follow-btn">FOLLOW</a>
        </div>
    </header>

    <section id="vision">
        <div class="card">
            <h2>The Vision</h2>
            <p>"Small phone, big vision. Proving that powerful stories can be told by anyone, anywhere."</p>
        </div>
    </section>

    <section id="recruitment">
        <div class="card">
            <h2>Join the Cast 🎭</h2>
            <p>I am looking for people to build with. No big setup needed, just talent.</p>
            
            <form action="https://formspree.io/f/xeeekqkr" method="POST">
                <input type="text" name="Name" placeholder="Your Name" required>
                <input type="text" name="WhatsApp" placeholder="WhatsApp Number" required>
                <select name="Role">
                    <option value="Actor">Actor/Actress</option>
                    <option value="Writer">Story Writer</option>
                    <option value="Other">Other Talent</option>
                </select>
                <button type="submit" class="submit-btn">SEND APPLICATION</button>
            </form>
        </div>
    </section>

    <footer>
        <p>Verified Smartphone Studio &copy; 2026</p>
    </footer>

</body>
    </html>

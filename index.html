<!DOCTYPE html>

    <style>
        :root {
            --bg: #030712; --text: #ffffff; --primary: #00d2ff;
            --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
            --card: #0a1120;
        }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* HEADER & NAV */
        nav { position: fixed; top: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-sizing: border-box; backdrop-filter: blur(10px); background: rgba(3,7,18,0.8); border-bottom: 1px solid var(--border); }
        .logo-text { font-weight: 900; letter-spacing: 2px; font-size: 18px; color: var(--primary); text-transform: uppercase; }
        
        .social-icons a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.7; transition: 0.3s; }
        .social-icons a:hover { opacity: 1; color: var(--primary); }

        header { padding: 120px 20px 60px; text-align: center; }
        h1 { font-size: clamp(2rem, 10vw, 3.5rem); font-weight: 900; margin: 0; text-transform: uppercase; line-height: 1; }
        .verified-badge { width: 28px; fill: #1DA1F2; vertical-align: middle; }
        .impact-tag { font-size: 12px; letter-spacing: 8px; color: var(--primary); text-transform: uppercase; margin-top: 15px; display: block; font-weight: 800; }

        /* MAIN SECTIONS */
        .container { width: 92%; max-width: 700px; margin: 0 auto; }
        
        .section-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; color: var(--primary); margin-bottom: 20px; display: block; opacity: 0.6; }

        .glass-card {
            background: var(--card); border: 1px solid var(--border);
            padding: 30px; border-radius: 28px; margin-bottom: 30px;
            backdrop-filter: blur(20px); position: relative;
        }

        /* MEDIA GRID */
        .video-vault { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 15px; overflow: hidden; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .video-vault iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .post-img { width: 100%; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--border); }

        /* ADMIN SYSTEM */
        #ai-action-button { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: linear-gradient(135deg, var(--primary), #bc13fe); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9999; box-shadow: 0 10px 30px rgba(0,210,255,0.3); }
        #admin-window { position: fixed; bottom: 110px; right: 30px; width: 340px; max-height: 75vh; display: none; z-index: 9999; overflow-y: auto; }
        .admin-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; box-sizing: border-box; }
        .action-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; }

        /* FOOTER & LEGAL */
        footer { padding: 80px 20px 40px; text-align: center; border-top: 1px solid var(--border); margin-top: 50px; background: rgba(0,0,0,0.2); }
        .footer-links { margin-bottom: 20px; }
        .footer-links a { color: white; text-decoration: none; font-size: 11px; margin: 0 10px; opacity: 0.5; }
        .support-text { font-size: 10px; opacity: 0.4; line-height: 2; margin-top: 20px; }

        @keyframes popIn { from{opacity:0; transform:scale(0.9)} to{opacity:1; transform:scale(1)} }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <nav>
        <div class="logo-text">Blessed Studios</div>
        <div class="social-icons">
            <a href="https://www.facebook.com/Blessedstudios1" target="_blank">FB</a>
            <a href="https://www.instagram.com/studiosblessed" target="_blank">IG</a>
        </div>
    </nav>

    <header>
        <h1>BLESSED STUDIOS <svg class="verified-badge" viewBox="0 0 24 24"><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.818-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.437 2.25c-.416-.165-.866-.25-1.336-.25-2.11 0-3.818 1.79-3.818 4 0 .495.083.965.238 1.4-1.272.65-2.147 2.018-2.147 3.6 0 1.495.782 2.798 1.942 3.486-1.16.688-1.942 1.991-1.942 3.486 0 2.21 1.71 3.998 3.818 3.998.47 0 .92-.084 1.336-.25C9.182 21.585 10.49 22.5 12 22.5s2.816-.917 3.437-2.25c.416.165.866.25 1.336.25 2.11 0 3.818-1.79 3.818-4 0-.495-.083-.965-.238-1.4 1.272-.65 2.147-2.018 2.147-3.6zm-11.5 5l-4.5-4.5 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z"></path></svg></h1>
        <span class="impact-tag">Impactful Content</span>
    </header>

    <div class="container">
        <span class="section-label">Global Impact Feed</span>
        <div id="live-feed"></div>
    </div>

    <div id="ai-action-button" onclick="toggleAdmin()">✨</div>
    <div id="admin-window" class="glass-card">
        <div id="admin-auth">
            <input type="password" id="admin-pass" class="admin-input" placeholder="CEO Key">
            <button class="action-btn" onclick="unlockAdmin()">Enter Studio</button>
        </div>
        <div id="admin-post" style="display:none;">
            <input type="text" id="p-title" class="admin-input" placeholder="Title">
            <input type="text" id="p-label" class="admin-input" placeholder="Label (WORSHIP, NEWS)">
            <input type="text" id="p-video" class="admin-input" placeholder="YouTube URL">
            <input type="file" id="p-file" class="admin-input">
            <textarea id="p-content" class="admin-input" style="height:100px;" placeholder="Message..."></textarea>
            <button id="pub-btn" class="action-btn" onclick="publishPost()">🚀 Global Release</button>

        </div>
        <div class="support-text">
            &copy; 2026 BLESSED STUDIOS | CEO BLESSED FREDRICK IBOI<br>
            Managed by Blessed Studios AI Infrastructure<br>
            Official Support: blessedstudios50@gmail.com
        </div>

    <script>
        const SB_URL = "https://ulctlyvistlcjapqbzmp.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY3RseXZpc3RsY2phcHFiem1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjk2OTEsImV4cCI6MjA4NjkwNTY5MX0.tCm1YPUWQ8s2e9mdq-wMhSJql10lrApfRF40wDHC7ls";
        const CEO_KEY = "Blessed2026";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        function toggleAdmin() {
            const win = document.getElementById('admin-window');
            win.style.display = win.style.display === 'block' ? 'none' : 'block';
        }

        function unlockAdmin() {
            if(document.getElementById('admin-pass').value === CEO_KEY) {
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-post').style.display = 'block';
            }
        }

        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function publishPost() {
            const title = document.getElementById('p-title').value;
            const content = document.getElementById('p-content').value;
            const videoUrl = document.getElementById('p-video').value;
            const fileInput = document.getElementById('p-file');
            const btn = document.getElementById('pub-btn');

            btn.innerText = "Releasing..."; btn.disabled = true;

            let imageUrl = "";
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const path = `${Date.now()}-${file.name}`;
                await _supabase.storage.from('images').upload(path, file);
                imageUrl = _supabase.storage.from('images').getPublicUrl(path).data.publicUrl;
            }

            await _supabase.from('posts').insert([{ 
                title, label: document.getElementById('p-label').value, 
                content, image: imageUrl, video_url: videoUrl 
            }]);
            location.reload();
        }

        async function loadFeed() {
            const { data } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            if(data) {
                document.getElementById('live-feed').innerHTML = data.map(p => {
                    const ytID = p.video_url ? getYouTubeID(p.video_url) : null;
                    return `
                    <div class="glass-card">
                        ${ytID ? `<div class="video-vault"><iframe src="https://www.youtube.com/embed/${ytID}" allowfullscreen></iframe></div>` : ''}
                        ${p.image && !ytID ? `<img src="${p.image}" class="post-img">` : ''}
                        <span class="section-label" style="margin-bottom:10px;">${p.label || 'Update'}</span>
                        <div style="font-size:24px; font-weight:900; margin-bottom:15px;">${p.title}</div>
                        <p style="opacity:0.8; line-height:1.7; font-size:15px;">${p.content}</p>
                    </div>
                `}).join('');
            }
        }

        // Particle System
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function init() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = init; init();
        class P { constructor(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.v=Math.random()*0.1+0.05;} update(){this.y-=this.v; if(this.y<0)this.y=canvas.height;} draw(){ctx.fillStyle="#00d2ff";ctx.globalAlpha=0.15;ctx.beginPath();ctx.arc(this.x,this.y,1,0,Math.PI*2);ctx.fill();} }
        for(let i=0; i<40; i++) pts.push(new P());
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(anim); }

        loadFeed(); anim();
    </script>
</body>
